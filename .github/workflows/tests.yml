name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
        laravel: ["12.*", "13.*"]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: "12.*"
            testbench: "10.*"
          - laravel: "13.*"
            testbench: "11.*"

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    env:
      COVERAGE: ${{ matrix.php == '8.4' && matrix.laravel == '13.*' && matrix.stability == 'prefer-stable' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, sqlite, pdo_sqlite, zip
          coverage: ${{ env.COVERAGE == 'true' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        if: env.COVERAGE != 'true'
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: env.COVERAGE == 'true'
        run: vendor/bin/phpunit --coverage-clover=clover.xml

      - name: Upload coverage
        if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: clover.xml
          flags: php
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  mysql:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.4"
            laravel: "12.*"
            testbench: "10.*"
            stability: prefer-lowest
            mysql: "8.0"
          - php: "8.5"
            laravel: "13.*"
            testbench: "11.*"
            stability: prefer-stable
            mysql: "8.4"

    name: MySQL ${{ matrix.mysql }} - PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: meta_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: meta_test
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests on MySQL
        run: vendor/bin/phpunit

  without-translatable:
    runs-on: ubuntu-latest

    name: Without javaabu/translatable

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo, sqlite, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies without translatable
        run: |
          composer remove --dev javaabu/translatable --no-update --no-interaction
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit --testsuite Unit,Feature

  dependencies:
    runs-on: ubuntu-latest

    name: Production dependencies

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-dev

      # javaabu/helpers pins javaabu/settings ^1, which breaks installs next to settings v2.
      - name: No javaabu/helpers or javaabu/settings v1
        run: |
          tree="$(composer show --tree --no-dev)"
          if echo "$tree" | grep -q "javaabu/helpers"; then
            echo "javaabu/helpers is a production dependency"; exit 1
          fi
          if composer show --no-dev javaabu/settings 2>/dev/null | grep -qE "^versions *: .*\b1\."; then
            echo "javaabu/settings v1 is a production dependency"; exit 1
          fi
          echo "ok"

  pint:
    runs-on: ubuntu-latest

    name: Pint

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test
